<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="robots" content="{{page.robots}}">
  <link rel="canonical" href="{{page.canonical}}">
  <meta name="theme-color" content="#ffffff">
  <meta name="author" content="{{site.name}}">
  <meta name="application-name" content="{{site.name}}">
  <meta name="apple-mobile-web-app-title" content="{{site.name}}">
  {{verify}}

  <meta property="og:type" content="{{page.ogType}}">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:locale" content="{{site.locale}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:image" content="{{page.ogImage}}">
  <meta property="og:image:alt" content="{{page.ogImageAlt}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{page.title}}">
  <meta name="twitter:description" content="{{page.description}}">
  <meta name="twitter:image" content="{{page.ogImage}}">
  <meta name="twitter:image:alt" content="{{page.ogImageAlt}}">

  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css?v={{version}}">
  <script defer src="/assets/js/main.js?v={{version}}"></script>

  <script type="application/ld+json">{{page.jsonld}}</script>
</head>
<body class="{{page.bodyClass}}">
{{> icons}}
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
</body>
</html>

<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="152" viewBox="4 14 500 152">
  <defs>
    <style>
      .word { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .tag { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Badge -->
  <rect x="8" y="18" width="144" height="144" rx="30" fill="#14213D" stroke="#2B3A5C" stroke-width="2"/>

  <!-- trailer box -->
  <rect x="34" y="56" width="76" height="38" rx="6" fill="#2BB8AE"/>

  <!-- frame rail -->
  <rect x="34" y="94" width="94" height="6" rx="3" fill="#F5F7FA"/>

  <!-- wheel -->
  <circle cx="60" cy="114" r="15" fill="#F5F7FA"/>
  <circle cx="60" cy="114" r="6" fill="#14213D"/>

  <!-- hitch arm + ball -->
  <line x1="128" y1="97" x2="118" y2="80" stroke="#F5F7FA" stroke-width="6" stroke-linecap="round"/>
  <circle cx="118" cy="76" r="8" fill="#F5F7FA"/>

  <!-- Wordmark -->
  <text x="180" y="98" class="word" font-size="52" fill="#FFFFFF">Hitch<tspan fill="#2BB8AE">Point</tspan></text>
</svg>